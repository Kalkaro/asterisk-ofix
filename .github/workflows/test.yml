# Clippy and the test suite, on every branch push and pull request. The AppImage workflow
# calls it too, so a v* tag's release waits for it.
name: Test

on:
  push:
    # Branches only: a tag push runs this through the AppImage workflow instead.
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    # The AppImage's build machine and toolchain, so the tests check what ships.
    runs-on: ubuntu-22.04
    env:
      # Keep in step with scripts/appimage.sh and flake.nix.
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
      # The UI tests run on Rune's headless Runtime, which needs no GPU or Vulkan driver.
      # They do measure text, so the fallback fonts the app gets on a desktop are installed:
      # DejaVu Sans for Cyrillic, Noto CJK for Chinese and Japanese.
      - run: >-
          sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
          fonts-dejavu-core fonts-noto-cjk
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
